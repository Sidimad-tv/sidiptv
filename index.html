        <style>
            .settings-container .row:has(a[href*="4gray"]),
            .settings-container .row:has(a[href*="iptvnator"]) { display: none !important; }
            .settings-container .row:has(> .column p):has(> .column br) { display: none !important; }
            .settings-container .row:has(> .column p):has(> .column br) + mat-divider,
            .settings-container .row:has(> .column p):has(> .column br) + div + mat-divider,
            .settings-container .row:has(> .column p):has(> .column br) + div + div + mat-divider { display: none !important; }
            .settings-container .row:has(a[href*="4gray"]) + mat-divider { display: none !important; }
            /* Toolbar reorder: sort, filter, +, settings(far right) */
            [data-test-id="sort-playlists"] { order: 1 !important; }
            [data-test-id="filter-playlist-by-type"] { order: 2 !important; }
            [data-test-id="add-playlist"] { order: 3 !important; }
            [data-test-id="open-settings"],
            [data-test-id="pwa-menu"] { order: 4 !important; }
            /* Color + and settings icons #a00 */
            [data-test-id="add-playlist"] .mat-icon,
            [data-test-id="open-settings"] .mat-icon,
            [data-test-id="pwa-menu"] .mat-icon { color: #a00 !important; }
            /* Ensure toolbar buttons respect order */
            .menu { display: flex !important; }
        </style>
        <script>
            if (global === undefined) {
                var global = window;
            }
        </script>
        <script>
            // Remove Version section and EPG note from Settings panel
            (function() {
                function r() {
                    var c = document.querySelector('.settings-container');
                    if (!c) return;
                    c.querySelectorAll('.row').forEach(function(row) {
                        var t = row.textContent || '';
                        // EPG row: has link to 4gray/iptvnator
                        if (t.includes('4gray') || t.includes('iptvnator')) { row.style.display = 'none'; return; }
                        // Version row: 2 columns, first has <p>, second has <br>
                        var co = row.querySelectorAll(':scope > .column');
                        if (co.length === 2 && co[0].querySelector('p') && co[1].querySelector('br')) {
                            [row.previousElementSibling, row.nextElementSibling].forEach(function(s) {
                                if (s && s.tagName === 'MAT-DIVIDER') s.style.display = 'none';
                            });
                            row.style.display = 'none';
                        }
                    });
                }
                // Poll aggressively 20x over 10s
                for (var i = 0; i < 20; i++) { setTimeout(r, i * 500); }
                // Also observe
                var mo = new MutationObserver(function() { setTimeout(r, 200); });
                mo.observe(document.body, { childList: true, subtree: true });
            })();
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
        <script>
            (function() {
                'use strict';
                var attached = new WeakSet();
                function isTsUrl(url) {
                    var d = typeof url === 'string' ? decodeURIComponent(url) : url;
                    return d && (d.includes('extension=ts') || d.includes('.ts?') || d.endsWith('.ts'));
                }
                function tryAttachMpegts(video) {
                    if (attached.has(video) || typeof mpegts === 'undefined') return false;
                    var src = video.currentSrc || video.src || (video.querySelector('source') || {}).src || '';
                    if (!isTsUrl(src)) return false;
                    attached.add(video);
                    try {
                        video.controls = true;
                        var player = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: src });
                        player.attachMediaElement(video);
                        player.load();
                        player.play();
                        video._mpegtsPlayer = player;
                        return true;
                    } catch(e) {
                        console.warn('mpegts init:', e);
                        return false;
                    }
                }
                function initObserver() {
                    if (!document.body) { setTimeout(initObserver, 100); return; }
                    var observer = new MutationObserver(function() {
                        document.querySelectorAll('video.video-js, video#video-player').forEach(function(v) {
                            if (!attached.has(v) && isTsUrl(v.src || v.currentSrc || '')) {
                                tryAttachMpegts(v);
                            }
                        });
                    });
                    observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
                }
                initObserver();
                document.addEventListener('play', function(e) {
                    if (e.target instanceof HTMLVideoElement) tryAttachMpegts(e.target);
                }, true);
            })();
        </script>
