[build]
  functions = "netlify-functions"
  publish = "."

[[redirects]]
  from = "/api/stalker"
  to = "/.netlify/functions/stalker"
  status = 200

[[redirects]]
  from = "/api/stalker/proxy"
  to = "/.netlify/functions/stalker"
  status = 200

[[redirects]]
  from = "/api/stream"
  to = "/.netlify/functions/stream"
  status = 200

[[redirects]]
  from = "/api/xtream/stream"
  to = "/.netlify/functions/stream"
  status = 200

[[redirects]]
  from = "/api/m3u/fetch"
  to = "/.netlify/functions/stalker"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
