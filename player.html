<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>sidiptv Player</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0b0b12;--bg2:#12121c;--bg3:#1a1a28;--border:#22223a;--text:#c8c8e0;--text2:#7878a0;--text3:#555570;--accent:#00d4a0;--accent2:#00d4a020;--accent3:#00b386;--red:#f55;--yellow:#f0b400;--radius:10px;--radius-sm:6px;--shadow:0 2px 12px rgba(0,0,0,.3)}
    body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh;width:100vw}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--text3)}

    #app{display:flex;height:100vh;width:100vw;align-items:stretch}

    /* Sidebar */
    #sb{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s,z-index .2s;z-index:50;box-shadow:2px 0 8px rgba(0,0,0,.2)}
    #sb-h{height:64px;padding:0 24px;font-size:18px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;color:var(--accent);letter-spacing:.5px;flex-shrink:0;background:linear-gradient(135deg,var(--bg2),var(--bg3))}
    #sb-h span{font-size:26px}
    #sb-n{padding:12px 0;flex:1;overflow-y:auto}
    #sb-n button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 24px;background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;text-align:left;transition:all .15s;border-left:4px solid transparent;position:relative}
    #sb-n button:hover{background:var(--bg3);color:var(--text);transform:translateX(4px)}
    #sb-n button.act{background:var(--accent2);color:var(--accent);border-left-color:var(--accent);font-weight:600}
    #sb-n button .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0}
    #sb-f{border-top:1px solid var(--border);max-height:240px;overflow-y:auto;flex-shrink:0}
    .src-item{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;font-size:13px;transition:all .1s;border-radius:var(--radius-sm);margin:4px 8px}
    .src-item:hover{background:var(--bg3);transform:translateX(2px)}
    .src-item.act{background:var(--accent2);border:1px solid var(--accent)}
    .src-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .src-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .src-item .del{color:var(--text3);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:12px;transition:all .1s}
    .src-item .del:hover{color:var(--red);background:#2a1a1a;transform:scale(1.1)}
    #add-src{width:100%;padding:14px 20px;background:linear-gradient(135deg,var(--accent),var(--accent3));border:none;color:#fff;font-size:13px;cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:8px;justify-content:center;font-weight:500;letter-spacing:.5px;border-radius:0 0 var(--radius) var(--radius)}
    #add-src:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,212,160,.3)}

    /* Mobile toggle */
    #sb-toggle{display:none;position:fixed;top:12px;left:12px;z-index:60;background:var(--bg3);border:1px solid var(--border);border-radius:10px;width:44px;height:44px;color:var(--text);font-size:20px;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:all .15s}
    #sb-toggle:hover{background:var(--accent);color:#fff;transform:scale(1.05)}
    #sb-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0006;z-index:49}
    #sb-overlay.show{display:block}
    #sb.mobile-show{transform:translateX(0)}

    /* Main content */
    #mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    #mn-h{display:flex;align-items:center;gap:16px;padding:0 28px;height:64px;border-bottom:1px solid var(--border);flex-shrink:0;background:linear-gradient(90deg,transparent,rgba(0,212,160,.05));backdrop-filter:blur(10px)}
    #mn-h h1{font-size:20px;font-weight:600;white-space:nowrap;letter-spacing:.3px}
    #mn-h #view-sub{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #srch-w{position:relative;margin-left:auto;flex-shrink:0}
    #srch-w input{background:var(--bg3);border:1px solid var(--border);border-radius:24px;padding:10px 18px 10px 38px;color:var(--text);font-size:13px;width:200px;outline:none;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
    #srch-w input:focus{border-color:var(--accent);width:240px;box-shadow:0 0 0 3px rgba(0,212,160,.1)}
    #srch-w .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;pointer-events:none}
    #mn-c{flex:1;overflow-y:auto;padding:12px;background:radial-gradient(circle at 30% 30%,rgba(0,212,160,.03),transparent)}

    /* Loading */
    .ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:none}
    .ld .sp{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;box-shadow:0 0 20px rgba(0,212,160,.3)}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Categories */
    .cats{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg2)}
    .cats button{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:8px 16px;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;font-weight:500}
    .cats button.act{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(0,212,160,.3)}
    .cats button:hover{border-color:var(--accent);transform:translateY(-2px)}

    /* Channel list */
    .ch-list{padding:8px}
    .ch{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;border-radius:var(--radius);transition:all .1s;background:var(--bg2)}
    .ch:hover{background:var(--bg3);transform:translateX(6px);box-shadow:var(--shadow)}
    .ch .n{color:var(--text3);font-size:12px;min-width:35px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
    .ch img,.ch .def{width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
    .ch .def{background:var(--bg3);display:flex;align-items:center;justify-content-center;font-size:18px}
    .ch .nm{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
    .ch .st{color:var(--text3);cursor:pointer;font-size:16px;padding:4px 6px;transition:all .1s;border-radius:6px}
    .ch .st.on{color:var(--yellow);background:rgba(240,180,0,.1);box-shadow:0 0 12px rgba(240,180,0,.2)}
    .ch .st:hover{color:var(--yellow);transform:scale(1.2)}

    /* VOD Grid */
    .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:16px}
    .card{background:var(--bg2);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;border:1px solid transparent;position:relative}
    .card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .card .img-wrap{position:relative;aspect-ratio:2/3;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--text3);overflow:hidden}
    .card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
    .card:hover img{transform:scale(1.1)}
    .card .nm{padding:12px 16px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:500}
    .card .rating{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.8);color:var(--yellow);padding:2px 6px;border-radius:12px;font-size:10px;font-weight:600}
    .card .quality{position:absolute;bottom:8px;right:8px;background:var(--accent);color:#fff;padding:2px 6px;border-radius:12px;font-size:9px;font-weight:600}

    /* Empty state */
    .emp{padding:60px 24px;text-align:center;color:var(--text3);font-size:14px}
    .emp .ic{font-size:48px;margin-bottom:20px;display:block;opacity:.6}
    .emp .msg{color:var(--text2);margin-top:8px;font-size:12px}

    /* Dashboard */
    .wel{padding:50px 24px;text-align:center;max-width:450px;margin:0 auto}
    .wel .ic{font-size:56px;margin-bottom:20px;display:block;filter:drop-shadow(0 0 20px rgba(0,212,160,.3))}
    .wel h2{font-size:24px;margin-bottom:10px;font-weight:700}
    .wel p{font-size:13px;color:var(--text2);line-height:1.6}
    .src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:16px}
    .src-card{background:var(--bg2);border-radius:var(--radius);padding:24px;cursor:pointer;transition:all .2s;border:1px solid transparent;box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .src-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .src-card .ico{font-size:32px;margin-bottom:16px;display:block;text-align:center;filter:drop-shadow(0 0 16px rgba(0,212,160,.2))}
    .src-card .title{font-weight:700;font-size:15px;letter-spacing:.3px}
    .src-card .sub{font-size:12px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .src-card .status{font-size:11px;color:var(--accent);margin-top:8px;display:none;font-weight:600}
    .src-card.connected .status{display:block;background:rgba(0,212,160,.1);padding:4px 12px;border-radius:20px}
    .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px 16px 0}
    .stat{background:var(--bg2);border-radius:var(--radius);padding:20px 24px;text-align:center;border:1px solid var(--border)}
    .stat .val{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:.5px}
    .stat .lbl{font-size:12px;color:var(--text2);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}

    /* Series detail */
    .series-detail{padding:20px}
    .series-detail .back{background:none;border:none;color:var(--accent);cursor:pointer;font-size:15px;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:var(--radius-sm);transition:all .15s; margin-bottom:16px}
    .series-detail .back:hover{background:var(--accent);color:#fff;transform:translateX(-4px)}
    .series-header{display:flex;gap:20px;margin-bottom:24px;align-items:start}
    .series-header img{width:140px;height:210px;object-fit:cover;border-radius:12px;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,.4)}
    .series-header .info h2{font-size:22px;margin-bottom:8px;font-weight:700}
    .series-header .info p{font-size:13px;color:var(--text2);line-height:1.6}
    .series-header .info .meta{font-size:12px;color:var(--text3);margin-top:8px;display:inline-block;padding:2px 8px;border-radius:12px;background:var(--bg3)}
    .series-header .info .rating{color:var(--yellow);margin-left:10px;font-weight:600}
    .season-block{margin-bottom:20px}
    .season-h{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;border-radius:var(--radius);background:var(--bg2);margin-bottom:8px;transition:all .15s}
    .season-h:hover{background:var(--bg3);transform:translateX(4px)}
    .season-h .arrow{font-size:14px;color:var(--accent);transition:transform .2s}
    .season-h.open .arrow{transform:rotate(90deg)}
    .season-h .sname{font-size:15px;font-weight:600;flex:1}
    .season-h .scount{font-size:12px;color:var(--text3);background:var(--bg3);padding:2px 8px;border-radius:12px}
    .ep-list{display:none;padding-left:12px}
    .ep-list.open{display:block}
    .ep-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;transition:all .1s;background:var(--bg2);margin-bottom:4px}
    .ep-item:hover{background:var(--bg3);transform:translateX(4px)}
    .ep-item img{width:48px;height:32px;object-fit:cover;border-radius:6px;flex-shrink:0}
    .ep-item .enm{font-size:14px;flex:1;font-weight:500}
    .ep-item .play-ico{font-size:14px;color:var(--accent);background:rgba(0,212,160,.1);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content-center}

    /* Player overlay */
    #ply{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;flex-direction:column}
    #ply.show{display:flex}
    #ply .top-bar{display:flex;align-items:center;gap:16px;padding:16px 24px;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);position:absolute;top:0;left:0;right:0;z-index:5;opacity:0;transition:opacity .3s}
    #ply .bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:16px 24px 20px;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);z-index:5;opacity:0;transition:opacity .3s}
    #ply:hover .top-bar,#ply:hover .bottom-bar{opacity:1}
    #ply.show-controls .top-bar,#ply.show-controls .bottom-bar{opacity:1}
    #ply-back{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:24px;cursor:pointer;padding:8px;transition:all .15s;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
    #ply-back:hover{background:var(--accent);color:#fff;transform:scale(1.1)}
    #ply-info{font-size:14px;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
    #ply-fs{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:20px;cursor:pointer;padding:8px;transition:all .15s;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content-center}
    #ply-fs:hover{background:var(--accent);color:#fff;transform:scale(1.1)}
    #vid{width:100%;height:100%;object-fit:contain;background:#000;display:block;max-width:100%}
    .controls-row{display:flex;align-items:center;gap:16px}
    #ply-play{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px 8px;transition:all .15s;min-width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content-center}
    #ply-play:hover{background:var(--accent);color:#fff;transform:scale(1.1)}
    #pr{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:4px;cursor:pointer;position:relative;overflow:hidden}
    #pr:hover{height:8px}
    #pr-fill{height:100%;background:var(--accent);border-radius:4px;width:0;transition:width .15s}
    #tm{font-size:12px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;min-width:90px;text-align:center;font-weight:500}
    #ply-vol{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;padding:6px 8px;transition:all .15s;min-width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content-center}
    #ply-vol:hover{background:var(--accent);color:#fff;transform:scale(1.1)}
    .center-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff8;font-size:16px;pointer-events:none;z-index:3;font-weight:500}

    /* Modal */
    #mod{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
    #mod.show{display:flex}
    #mod-in{background:var(--bg2);border-radius:16px;padding:32px;width:460px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.4);border:1px solid var(--border)}
    #mod-in h2{font-size:20px;margin-bottom:24px;color:var(--text);font-weight:600}
    #mod-tabs{display:flex;gap:8px;margin-bottom:24px}
    #mod-tabs button{flex:1;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:13px;cursor:pointer;transition:all .15s;font-weight:500}
    #mod-tabs button.act{background:var(--accent);border-color:var(--accent);color:#fff}
    #mod-tabs button:hover{border-color:var(--accent);transform:translateY(-2px)}
    #mod-form label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;margin-top:16px;font-weight:500}
    #mod-form label:first-child{margin-top:0}
    #mod-form input{width:100%;padding:14px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:all .15s}
    #mod-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,160,.1)}
    #mod-form .btns{display:flex;gap:12px;margin-top:24px}
    #mod-form button{flex:1;padding:14px;border-radius:10px;border:none;font-size:14px;cursor:pointer;font-weight:600;transition:all .15s}
    #mod-form button:hover{transform:translateY(-2px)}
    #mod-form .sc{background:var(--bg3);color:var(--text2)}
    #mod-form .pr{background:var(--accent);color:#000}
    #mod-form .pr:disabled{opacity:.4;cursor:default}
    #mod-st{font-size:12px;margin-top:16px;text-align:center;min-height:20px;font-weight:500}

    /* Scrollbar for main content */
    #mn-c::-webkit-scrollbar{width:6px}
    #mn-c::-webkit-scrollbar-track{background:transparent}
    #mn-c::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    #mn-c::-webkit-scrollbar-thumb:hover{background:var(--accent)}

    /* Responsive */
    @media(max-width:768px){
      #sb{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);z-index:50;width:280px}
      #sb-toggle{display:flex}
      #mn-h{padding:0 16px 0 60px;height:60px}
      #mn-h h1{font-size:18px}
      #srch-w input{width:160px;font-size:12px}
      #srch-w input:focus{width:200px}
      .src-grid{grid-template-columns:1fr;padding:12px}
      .stats{grid-template-columns:repeat(2,1fr)}
      .gr{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));padding:12px;gap:12px}
      #mod-in{padding:24px;width:95vw}
      .series-header{flex-direction:column;align-items:center;text-align:center}
      .series-header img{width:120px;height:180px}
      .ch{padding:10px 14px;gap:12px}
      .ch img,.ch .def{width:32px;height:32px}
      .card{border-radius:8px}
      .card .img-wrap{border-radius:8px 8px 0 0}
    }
    @media(min-width:769px){
      #sb{transform:translateX(0)!important}
    }
  </style>
</head>
<body>
<button id="sb-toggle">☰</button>
<div id="sb-overlay"></div>
<div id="app">
  <div id="sb">
    <div id="sb-h"><span>📺</span> sidiptv</div>
    <div id="sb-n">
      <button data-view="dash" class="act"><span class="ico">🏠</span> Dashboard</button>
      <button data-view="tv"><span class="ico">📺</span> Live TV</button>
      <button data-view="movies"><span class="ico">🎬</span> Movies</button>
      <button data-view="series"><span class="ico">📺</span> Series</button>
      <button data-view="favs"><span class="ico">⭐</span> Favorites</button>
    </div>
    <div id="sb-f">
      <div id="src-list"></div>
      <button id="add-src">+ Add Source</button>
    </div>
  </div>
  <div id="mn">
    <div id="mn-h">
      <h1 id="view-title">Dashboard</h1>
      <span id="view-sub"></span>
      <div id="srch-w"><span class="ico">🔍</span><input id="search" placeholder="Search..."></div>
    </div>
    <div id="mn-c"></div>
  </div>
</div>
<div id="ply">
  <div class="top-bar bar">
    <button id="ply-back">←</button>
    <span id="ply-info"></span>
    <button id="ply-fs">⛶</button>
  </div>
  <video id="vid" playsinline></video>
  <div class="ld" id="ld"><div class="sp"></div></div>
  <div class="center-msg" id="center-msg"></div>
  <div class="bottom-bar bar" id="b-bot">
    <div class="controls-row">
      <button id="ply-play">▶</button>
      <div id="pr"><div id="pr-fill"></div></div>
      <span id="tm">0:00</span>
      <button id="ply-vol">🔊</button>
    </div>
  </div>
</div>
<div id="mod">
  <div id="mod-in">
    <h2>Add Source</h2>
    <div id="mod-tabs">
      <button data-type="stalker" class="act">📡 Portal</button>
      <button data-type="xtream">🔑 Xtream</button>
      <button data-type="m3u">📋 M3U</button>
    </div>
    <div id="mod-form"></div>
    <div id="mod-st"></div>
  </div>
</div>
<script src="js/stalker.js"></script>
<script src="js/app.js"></script>
<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  /* Mobile sidebar toggle */
  (function(){
    var btn = document.getElementById('sb-toggle');
    var ov = document.getElementById('sb-overlay');
    var sb = document.getElementById('sb');
    btn.addEventListener('click', function(){
      sb.classList.toggle('mobile-show');
      ov.classList.toggle('show');
    });
    ov.addEventListener('click', function(){
      sb.classList.remove('mobile-show');
      ov.classList.remove('show');
    });
  })();
</script>
</body>
</html>
