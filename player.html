<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>sidiptv Player</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0d0d14;color:#c8c8e0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh}
    #app{display:flex;flex-direction:column;height:100vh}
    #sb{width:260px;background:#12121a;border-right:1px solid #222;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
    #sb-h{padding:14px 16px;font-size:15px;font-weight:600;border-bottom:1px solid #222;display:flex;align-items:center;gap:8px}
    #sb-n{flex:1;overflow-y:auto;padding:6px 0}
    #sb-n button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;background:none;border:none;color:#7878a0;font-size:13px;cursor:pointer;text-align:left;transition:.1s}
    #sb-n button:hover{background:#1a1a22;color:#c8c8e0}
    #sb-n button.act{background:#1a1a26;color:#00d4a0;border-right:3px solid #00d4a0}
    #sb-n button img{width:18px;height:18px;opacity:.6}
    #sb-n button.act img{opacity:1}
    #sb-f{flex-shrink:0;border-top:1px solid #222;padding:4px 0;max-height:200px;overflow-y:auto}
    .src-item{padding:8px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;transition:.1s}
    .src-item:hover{background:#1a1a22}
    .src-item.act{background:#1a1a26;color:#00d4a0}
    .src-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .src-item .del{margin-left:auto;color:#555;cursor:pointer;padding:2px 4px;border-radius:4px;font-size:11px}
    .src-item .del:hover{color:#f55;background:#2a1a1a}
    #mn{flex:1;display:flex;flex-direction:column;overflow:hidden}
    #mn-h{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #222;flex-shrink:0}
    #mn-h h1{font-size:17px;font-weight:600}
    #mn-h span{font-size:12px;color:#555}
    #srch-w{position:relative;margin-left:auto}
    #srch-w input{background:#1a1a22;border:1px solid #333;border-radius:8px;padding:6px 12px 6px 32px;color:#c8c8e0;font-size:12px;width:200px;outline:none}
    #srch-w input:focus{border-color:#00d4a0}
    #srch-w::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.4}
    #mn-c{flex:1;overflow-y:auto;padding:6px}
    .cats{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid #1a1a22}
    .cats button{background:#1a1a22;border:1px solid #333;border-radius:20px;padding:5px 14px;color:#7878a0;font-size:11px;cursor:pointer;transition:.1s;white-space:nowrap}
    .cats button.act{background:#00d4a020;border-color:#00d4a0;color:#00d4a0}
    .cats button:hover{border-color:#555}
    .ch-list{padding:4px}
    .ch{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-radius:8px;transition:.05s}
    .ch:hover{background:#1a1a26}
    .ch .n{color:#555;font-size:11px;min-width:28px;text-align:right;font-weight:500}
    .ch img,.ch .def{width:28px;height:28px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#1a1a22;display:flex;align-items:center;justify-content:center;font-size:14px}
    .ch .nm{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ch .st{color:#333;cursor:pointer;font-size:14px;padding:2px;transition:.1s}
    .ch .st.on{color:#f0b400}
    .ch .st:hover{color:#f0b400}
    .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:8px}
    .card{background:#1a1a22;border-radius:10px;overflow:hidden;cursor:pointer;transition:.1s}
    .card:hover{background:#1a1a26;transform:translateY(-2px)}
    .card img{width:100%;aspect-ratio:2/3;object-fit:cover}
    .card .nm{padding:8px 10px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .emp{padding:40px 20px;text-align:center;color:#555;font-size:13px}
    .emp .ic{font-size:32px;margin-bottom:12px}
    .ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;display:none}
    .ld .sp{width:32px;height:32px;border:3px solid #333;border-top-color:#00d4a0;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #ply{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;flex-direction:column}
    #ply.show{display:flex}
    #ply .bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,#0008,transparent);position:absolute;top:0;left:0;right:0;z-index:5;opacity:1;transition:opacity .3s}
    #ply .b-bot{position:absolute;bottom:0;left:0;right:0;padding:10px 16px 14px;background:linear-gradient(0deg,#0008,transparent);z-index:5;opacity:1;transition:opacity .3s}
    #ply-back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px}
    #ply-info{font-size:13px;color:#ccc;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #ply-vol,#ply-fs{background:none;border:none;color:#fff;font-size:14px;cursor:pointer;padding:4px}
    #ply-play{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;padding:4px}
    #vid{width:100%;height:100%;object-fit:contain;background:#000}
    #pr{height:4px;background:#333;border-radius:2px;cursor:pointer;position:relative;overflow:hidden}
    #pr-fill{height:100%;background:#00d4a0;border-radius:2px;width:0;transition:width .1s}
    #tm{font-size:11px;color:#888;font-variant-numeric:tabular-nums}
    /* Scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
    /* Modal */
    #mod{position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;z-index:200;display:none;align-items:center;justify-content:center}
    #mod.show{display:flex}
    #mod-in{background:#1a1a22;border-radius:12px;padding:24px;width:400px;max-width:90vw;max-height:80vh;overflow-y:auto}
    #mod-in h2{font-size:16px;margin-bottom:16px}
    #mod-tabs{display:flex;gap:4px;margin-bottom:16px}
    #mod-tabs button{flex:1;padding:8px;background:#12121a;border:1px solid #333;border-radius:8px;color:#7878a0;font-size:12px;cursor:pointer;transition:.1s}
    #mod-tabs button.act{background:#00d4a020;border-color:#00d4a0;color:#00d4a0}
    #mod-form label{display:block;font-size:11px;color:#555;margin-bottom:4px;margin-top:12px}
    #mod-form input{width:100%;padding:8px 12px;background:#12121a;border:1px solid #333;border-radius:8px;color:#c8c8e0;font-size:13px;outline:none}
    #mod-form input:focus{border-color:#00d4a0}
    #mod-form .btns{display:flex;gap:8px;margin-top:16px}
    #mod-form button{flex:1;padding:8px;border-radius:8px;border:none;font-size:12px;cursor:pointer}
    #mod-form .sc{background:#222;color:#7878a0}
    #mod-form .pr{background:#00d4a0;color:#000;font-weight:600}
    #mod-form .pr:disabled{opacity:.5;cursor:default}
    #mod-st{font-size:11px;margin-top:8px;text-align:center;min-height:16px}
  </style>
</head>
<body>
<div id="app">
  <div style="display:flex;flex:1;overflow:hidden">
    <div id="sb">
      <div id="sb-h">📺 sidiptv</div>
      <div id="sb-n">
        <button data-view="dash" class="act"><span>🏠</span> Dashboard</button>
        <button data-view="tv"><span>📺</span> Live TV</button>
        <button data-view="movies"><span>🎬</span> Movies</button>
        <button data-view="series"><span>📺</span> Series</button>
        <button data-view="favs"><span>⭐</span> Favorites</button>
      </div>
      <div id="sb-f">
        <div id="src-list"></div>
        <button id="add-src" style="width:100%;padding:8px 16px;background:none;border:none;border-top:1px solid #222;color:#00d4a0;font-size:12px;cursor:pointer">+ Add Source</button>
      </div>
    </div>
    <div id="mn">
      <div id="mn-h">
        <h1 id="view-title">Dashboard</h1>
        <span id="view-sub"></span>
        <div id="srch-w"><input id="search" placeholder="Search..."></div>
      </div>
      <div id="mn-c"></div>
    </div>
  </div>
</div>
<div id="ply">
  <div class="bar">
    <button id="ply-back">←</button>
    <span id="ply-info"></span>
    <button id="ply-fs">⛶</button>
  </div>
  <video id="vid" playsinline></video>
  <div class="ld" id="ld"><div class="sp"></div></div>
  <div class="b-bot">
    <div style="display:flex;align-items:center;gap:10px">
      <button id="ply-play">▶</button>
      <div id="pr"><div id="pr-fill"></div></div>
      <span id="tm">0:00 / 0:00</span>
      <button id="ply-vol">🔊</button>
    </div>
  </div>
</div>
<div id="mod">
  <div id="mod-in">
    <h2>Add Source</h2>
    <div id="mod-tabs">
      <button data-type="stalker" class="act">📡 Portal</button>
      <button data-type="xtream">🔑 Xtream</button>
      <button data-type="m3u">📋 M3U</button>
    </div>
    <div id="mod-form"></div>
    <div id="mod-st"></div>
  </div>
</div>
<script src="js/stalker.js"></script>
<script src="js/app.js"></script>
<script>
  // Enable scroll restoration based on platform
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
</script>
</body>
</html>
